[project]
name = "silabs-pycommander"
version = "0.1.4"
description = "Python library for Silicon Labs Simplicity Commander"
authors = [{ name = "Silicon Labs"}]
license = "LicenseRef-MSLA"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "silabs-pycommander-core==0.1.4",
  "silabs-pycommander-cli==0.1.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycommander"]

[project.optional-dependencies]
gui = ["silabs-pycommander-gui==0.1.4"]

[project.scripts]
pycommander = "pycommander.cli:main"
