[project]
name = "silabs-pycommander"
version = "0.1.3"
description = "Python library for Silicon Labs Simplicity Commander"
authors = [
    { name = "Silicon Labs"}
]
license = "LicenseRef-MSLA"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycommander"]

[project.optional-dependencies]
cli = ["silabs-pycommander-cli==0.1.3"]
gui = ["silabs-pycommander-gui==0.1.3"]
