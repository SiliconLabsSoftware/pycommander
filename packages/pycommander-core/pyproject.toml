[project]
name = "silabs-pycommander-core"
version = "1.0.0"
description = "Python library for Silicon Labs Simplicity Commander (core)"
authors = [{ name = "Silicon Labs"}]
license = "LicenseRef-MSLA"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
  "platformdirs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycommander_core"]
ignore-vcs = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build_hook.py"

[project.urls]
Homepage = "https://github.com/SiliconLabsSoftware/pycommander"
