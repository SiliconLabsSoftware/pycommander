[project]
name = "silabs-pycommander"
version = "0.1.1"
description = "Python library for Silicon Labs Simplicity Commander"
authors = [
    { name = "Silicon Labs"}
]
license = "LicenseRef-MSLA"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # TODO: Add dependencies here
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycommander"]
ignore-vcs = true

[tool.hatch.build.targets.wheel.package-data]
"pycommander._archive" = ["*.zip", "*.tar.bz"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build_hook.py"

[project.urls]
Homepage = "https://github.com/SiliconLabsSoftware/pycommander"

[project.scripts]
pycommander = "pycommander.cli:main"
