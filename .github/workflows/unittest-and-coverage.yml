name: Unit tests and Coverage Report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  unittest:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          check-latest: true

      - name: Pick Commander Executables
        if: matrix.platform != ''
        shell: bash
        run: |
          echo "platform: ${{ matrix.platform }}"
          CLI_TARGET_DIR="packages/pycommander-cli/src/pycommander_cli/_archive/"
          GUI_TARGET_DIR="packages/pycommander-gui/src/pycommander_gui/_archive/"

          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_win32_x64_*.zip 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_win32_x64_*.zip 2>/dev/null | head -1)
          elif [[ "${{ matrix.platform }}" == macos-* ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_osx_*.zip 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_osx_*.zip 2>/dev/null | head -1)
          elif [[ "${{ matrix.platform }}" == linux-x86_64 ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_linux_x86_64_*.tar.bz 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_linux_x86_64_*.tar.bz 2>/dev/null | head -1)
          elif [[ "${{ matrix.platform }}" == linux-aarch64 ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_linux_aarch64_*.tar.bz 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_linux_aarch64_*.tar.bz 2>/dev/null | head -1)
          else
            echo "Unsupported platform: ${{ matrix.platform }}"
            exit 1
          fi

          echo "Copying CLI archive: $CLI_ARCHIVE"
          cp "$CLI_ARCHIVE" "$CLI_TARGET_DIR"

          echo "Listing contents of $CLI_TARGET_DIR:"
          ls -la "$CLI_TARGET_DIR"

          echo "Copying GUI archive: $GUI_ARCHIVE"
          cp "$GUI_ARCHIVE" "$GUI_TARGET_DIR"

          echo "Listing contents of $GUI_TARGET_DIR:"
          ls -la "$GUI_TARGET_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage
          python -m pip install -e packages/pycommander-core -e packages/pycommander-cli -e packages/pycommander-gui -e packages/pycommander --force-reinstall
          python -m pip install -r packages/*/tests/requirements.txt

      - name: Run unit tests for total coverage
        shell: bash
        run: |
          coverage run --parallel-mode run_tests.py
          ls -la

      - name: Upload raw coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.platform }}
          path: .coverage*
          include-hidden-files: true

      - name: Generate local coverage report
        shell: bash
        run: |
          coverage run run_tests.py
          coverage report
          coverage html

      - name: Upload local coverage report
        uses: actions/upload-artifact@v4
        with:
          name: local-coverage-report-${{ matrix.platform }}
          path: htmlcov/

  generate-coverage-report:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data/
          merge-multiple: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage

      - name: Generate combined coverage report
        shell: bash
        run: |
          ls -la
          coverage combine coverage-data
          coverage report
          coverage html

      - name: Add coverage to summary
        shell: bash
        run: |
          TOTAL=$(coverage report | grep TOTAL | awk '{print $4}')
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Coverage: $TOTAL**" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-combined
          path: htmlcov/
