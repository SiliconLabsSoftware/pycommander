name: Build wheels and publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-wheels:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
          - os: ubuntu-22.04-arm
            platform: linux-aarch32
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          check-latest: true

      - name: Pick Commander Executables
        if: matrix.platform != ''
        shell: bash
        run: |
          echo "platform: ${{ matrix.platform }}"
          CLI_TARGET_DIR="packages/pycommander-cli/src/pycommander_cli/_archive/"
          GUI_TARGET_DIR="packages/pycommander-gui/src/pycommander_gui/_archive/"

          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_win32_x64_*.zip 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_win32_x64_*.zip 2>/dev/null | head -1)
          elif [[ "${{ matrix.platform }}" == macos-* ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_osx_*.zip 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_osx_*.zip 2>/dev/null | head -1)
          elif [[ "${{ matrix.platform }}" == linux-x86_64 ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_linux_x86_64_*.tar.bz 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_linux_x86_64_*.tar.bz 2>/dev/null | head -1)
          elif [[ "${{ matrix.platform }}" == linux-aarch32 ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_linux_aarch32_*.tar.bz 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_linux_aarch32_*.tar.bz 2>/dev/null | head -1)
          elif [[ "${{ matrix.platform }}" == linux-aarch64 ]]; then
            CLI_ARCHIVE=$(ls archives/Commander-cli_linux_aarch64_*.tar.bz 2>/dev/null | head -1)
            GUI_ARCHIVE=$(ls archives/Commander_linux_aarch64_*.tar.bz 2>/dev/null | head -1)
          else
            echo "Unsupported platform: ${{ matrix.platform }}"
            exit 1
          fi

          echo "Copying CLI archive: $CLI_ARCHIVE"
          cp "$CLI_ARCHIVE" "$CLI_TARGET_DIR"

          echo "Listing contents of $CLI_TARGET_DIR:"
          ls -la "$CLI_TARGET_DIR"

          echo "Copying GUI archive: $GUI_ARCHIVE"
          cp "$GUI_ARCHIVE" "$GUI_TARGET_DIR"

          echo "Listing contents of $GUI_TARGET_DIR:"
          ls -la "$GUI_TARGET_DIR"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch wheel

      - name: Build wheels
        shell: bash
        run: |
          for package in packages/*; do
            cd "$package"
            echo "Building wheel for $package"
            hatch build -t wheel
            cd "../.."
          done

      - name: Retag aarch32 wheel temporarily
        # This wheel is built on aarch64, but the Commander executable is aarch32.
        # We need to retag it to the correct platform. The real wheel will be retagged later,
        # to a tag that PyPI will accept.
        if: matrix.platform == 'linux-aarch32'
        shell: bash
        run: |
          for package in packages/*; do
            cd "$package"
            echo "Retagging wheel for $package"
            python -m wheel tags --remove --platform-tag linux_aarch32 dist/*.whl
            cd "../.."
          done

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}
          path: packages/*/dist/*.whl

  publish-to-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment: testpypi # Switch to 'pypi' to publish to the real PyPI

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          check-latest: true

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine wheel

      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          path: packages
          merge-multiple: true

      - name: Retag wheels
        run: |
          python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag manylinux2014_x86_64 packages/*/dist/*-linux_x86_64.whl
          python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag manylinux2014_armv7l packages/*/dist/*-linux_aarch32.whl
          python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag manylinux2014_aarch64 packages/*/dist/*-linux_aarch64.whl
          python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag macosx_10_9_universal2 packages/*/dist/*-macosx*.whl
          python -m wheel tags --remove --python-tag py3 --abi-tag none packages/*/dist/*-win_*.whl
          ls -la packages/*/dist/*.whl

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --verbose --repository testpypi packages/*/dist/*.whl

  clean-up:
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: dist-*
