name: Build wheels and publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-wheels:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flavor: linux-x86_64
          - os: ubuntu-22.04-arm
            flavor: linux-aarch64
          - os: ubuntu-22.04-arm
            flavor: linux-aarch32
          - os: macos-latest
            flavor: macos-arm64
          - os: windows-latest
            flavor: windows-x86

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          check-latest: true

      - name: Pick Commander Executable
        if: matrix.flavor != ''
        shell: bash
        run: |
          echo "flavor: ${{ matrix.flavor }}"
          TARGET_DIR="src/pycommander/_archive/"

          if [[ "${{ matrix.flavor }}" == windows-* ]]; then
            ARCHIVE=$(ls archives/Commander-cli_win32_x64_*.zip 2>/dev/null | head -1)
          elif [[ "${{ matrix.flavor }}" == macos-* ]]; then
            ARCHIVE=$(ls archives/Commander-cli_osx_*.zip 2>/dev/null | head -1)
          elif [[ "${{ matrix.flavor }}" == linux-x86_64 ]]; then
            ARCHIVE=$(ls archives/Commander-cli_linux_x86_64_*.tar.bz 2>/dev/null | head -1)
          elif [[ "${{ matrix.flavor }}" == linux-aarch32 ]]; then
            ARCHIVE=$(ls archives/Commander-cli_linux_aarch32_*.tar.bz 2>/dev/null | head -1)
          elif [[ "${{ matrix.flavor }}" == linux-aarch64 ]]; then
            ARCHIVE=$(ls archives/Commander-cli_linux_aarch64_*.tar.bz 2>/dev/null | head -1)
          else
            echo "Unsupported flavor: ${{ matrix.flavor }}"
            exit 1
          fi

          echo "Copying archive: $ARCHIVE"

          cp "$ARCHIVE" "$TARGET_DIR"

          echo "Listing contents of $TARGET_DIR:"
          ls -la "$TARGET_DIR"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch wheel

      - name: Build wheel
        run: hatch build -t wheel

      - name: Retag aarch32 wheel
        if: matrix.flavor == 'linux-aarch32'
        run: |
          python -m wheel tags --platform-tag manylinux2014_armv7l -w dist/ dist/*.whl
          rm -f dist/*-linux_aarch64.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.flavor }}
          path: dist/*.whl

  publish-to-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment: testpypi # Switch to 'pypi' to publish to the real PyPI

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          check-latest: true

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --repository testpypi dist/*.whl
