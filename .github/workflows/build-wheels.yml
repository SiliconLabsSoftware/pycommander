name: Build wheels

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vendor: linux-x86_64
          - os: ubuntu-22.04-arm
            vendor: linux-aarch64
          - os: macos-latest
            vendor: macos-arm64
          - os: windows-latest
            vendor: windows-x86

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          check-latest: true

      - name: Extract Commander Executable
        if: matrix.vendor != ''
        shell: bash
        run: |
          echo "Vendor: ${{ matrix.vendor }}"
          TARGET_DIR="src/pycommander/_bin"

          mkdir -p "$TARGET_DIR"

          if [[ "${{ matrix.vendor }}" == windows-* ]]; then
            # Windows: Find the zip file and extract with PowerShell
            ARCHIVE=$(ls archives/Commander-cli_win32_*.zip 2>/dev/null | head -1)
            echo "Extracting: $ARCHIVE"
            powershell -Command "Expand-Archive -Path '$ARCHIVE' -DestinationPath '$TARGET_DIR' -Force"
          elif [[ "${{ matrix.vendor }}" == macos-* ]]; then
            # macOS: Find the zip file and extract with unzip
            ARCHIVE=$(ls archives/Commander-cli_osx_*.zip 2>/dev/null | head -1)
            echo "Extracting: $ARCHIVE"
            unzip -o "$ARCHIVE" -d "$TARGET_DIR"
          else
            # Linux: Find the matching tar.bz file based on architecture
            if [[ "${{ matrix.vendor }}" == linux-x86_64 ]]; then
              ARCHIVE=$(ls archives/Commander-cli_linux_x86_64_*.tar.bz 2>/dev/null | head -1)
            elif [[ "${{ matrix.vendor }}" == linux-aarch32 ]]; then
              ARCHIVE=$(ls archives/Commander-cli_linux_aarch32_*.tar.bz 2>/dev/null | head -1)
            elif [[ "${{ matrix.vendor }}" == linux-aarch64 ]]; then
              ARCHIVE=$(ls archives/Commander-cli_linux_aarch64_*.tar.bz 2>/dev/null | head -1)
            fi
            echo "Extracting: $ARCHIVE"
            tar -xjf "$ARCHIVE" -C "$TARGET_DIR"
            find "$TARGET_DIR" -type f -exec chmod a+x {} + || true
          fi

          echo "Listing contents of $TARGET_DIR:"
          ls -la "$TARGET_DIR"

      - name: Smoke Test Commander Executable
        shell: bash
        run: |
          TARGET_DIR="src/pycommander/_bin"
          EXECUTABLE=""
          if [[ "${{ matrix.vendor }}" == windows-* ]]; then
            EXECUTABLE="$TARGET_DIR/Simplicity Commander CLI/commander-cli.exe"
          elif [[ "${{ matrix.vendor }}" == macos-* ]]; then
            EXECUTABLE="$TARGET_DIR/Commander-cli.app/Contents/MacOS/Commander-cli"
          else
            EXECUTABLE="./$TARGET_DIR/commander-cli/commander-cli"
          fi
          
          echo "Runner uname: $(uname -a)"
          echo "Runner architecture: $(uname -m)"
          echo "File info: $(file $EXECUTABLE)"

          echo "Smoke testing $EXECUTABLE"
          "$EXECUTABLE" --version
          if [ $? -ne 0 ]; then
            echo "Smoke test failed; Commander returned non-zero exit code"
            exit 1
          fi

