name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          check-latest: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install pycommander
        shell: bash
        run: |
          python -m pip install -e packages/pycommander-core
          python -m pip install -e packages/pycommander-cli
          python -m pip install -e packages/pycommander-gui

      - name: Run tests
        shell: bash
        run: |
          for package in packages/*; do
            cd "$package"
            echo "Running tests for $package"
            python -m unittest discover -s tests -p "test_*.py" -v
            cd "../.."
          done
